<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
            background: white;
            color: black;
        }

        h1 {
            margin-bottom: 30px;
        }

        .score {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .game {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            margin-bottom: 30px;
        }

        .player h2 {
            margin-bottom: 15px;
        }

        .choice {
            border: 1px solid black;
            width: 150px;
            height: 130px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .icon {
            font-size: 60px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            background: white;
            border: 1px solid black;
            padding: 10px 25px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin: 25px;
        }

        .history {
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
            text-align: left;
        }

        .history h2 {
            text-align: center;
        }

        .history-item {
            border-bottom: 1px solid #ccc;
            padding: 8px;
        }

        .rules {
            margin-top: 30px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <h1>Cricket Game</h1>

    <div class="score">
        You: <span id="playerScore">0</span>
        &nbsp;&nbsp; | &nbsp;&nbsp;
        Draw: <span id="drawScore">0</span>
        &nbsp;&nbsp; | &nbsp;&nbsp;
        Computer: <span id="computerScore">0</span>
    </div>


    <div class="game">

        <div class="player">

            <h2>You</h2>

            <div class="choice">

                <div class="icon" id="playerIcon">
                    ?
                </div>

                <div id="playerChoice">
                    Choose
                </div>

            </div>

        </div>


        <div>
            <h2>VS</h2>
        </div>


        <div class="player">

            <h2>Computer</h2>

            <div class="choice">

                <div class="icon" id="computerIcon">
                    ?
                </div>

                <div id="computerChoice">
                    Waiting
                </div>

            </div>

        </div>

    </div>


    <div id="result">
        Choose your move
    </div>


    <h2>Choose</h2>


    <div class="buttons">

        <button onclick="playGame('bat')">
            🏏 Bat
        </button>

        <button onclick="playGame('ball')">
            🔴 Ball
        </button>

        <button onclick="playGame('stumps')">
            🟥 Stumps
        </button>

    </div>


    <script>

        let score = JSON.parse(localStorage.getItem("cricketScore")) || {

            playerScore: 0,
            computerScore: 0,
            drawScore: 0,
            result: "Choose your move"

        };


        const choices = ["bat", "ball", "stumps"];


        const icons = {

            bat: "🏏",
            ball: "🔴",
            stumps: "🟥"

        };


        const names = {

            bat: "Bat",
            ball: "Ball",
            stumps: "Stumps"

        };


        function updateScore() {
            localStorage.setItem(
                "cricketScore",
                JSON.stringify(score)
            );

            document.getElementById("playerScore").textContent =
                score.playerScore;

            document.getElementById("computerScore").textContent =
                score.computerScore;

            document.getElementById("drawScore").textContent =
                score.drawScore;

            document.getElementById("result").textContent =
                score.result;

        }


        function playerWins(player, computer) {

            return (

                (player === "bat" && computer === "ball") ||

                (player === "ball" && computer === "stumps") ||

                (player === "stumps" && computer === "bat")

            );

        }


        function playGame(playerChoice) {

            let computerChoice =
                choices[Math.floor(Math.random() * choices.length)];


            document.getElementById("playerIcon").textContent =
                icons[playerChoice];

            document.getElementById("playerChoice").textContent =
                names[playerChoice];


            document.getElementById("computerIcon").textContent =
                icons[computerChoice];

            document.getElementById("computerChoice").textContent =
                names[computerChoice];


            if (playerChoice === computerChoice) {

                score.drawScore++;

                score.result = "Draw";

            }

            else if (playerWins(playerChoice, computerChoice)) {

                score.playerScore++;

                score.result = "You Win";

            }

            else {

                score.computerScore++;

                score.result = "Computer Wins";

            }
            updateScore();

        }


        updateScore();

    </script>

</body>

</html>
